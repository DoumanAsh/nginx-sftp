name: Docker

on:
  # Once a week
  schedule:
    - cron: '0 0 * * 0'
  push:
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile.*'
      - 'root/**/*'
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile.*'
      - 'root/**/*'

jobs:
  container:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        alpine_version:
          - 3.23
          - 3.24
    uses: DoumanAsh/douman-ci/.github/workflows/release-container.yaml@master
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    with:
      # Make sure to create repos in all container registries using the same name as the repo
      image_name: ${{ github.event.repository.name }}
      # Need dhi.io for hardened alpine image
      dhi_login: true
      container_file: "Dockerfile"
      use_oci: true
      platform: "linux"
      archs: "amd64 arm64"
      upload_container: ${{ github.event.pull_request.draft == false }}
      docker_user: "douman"
      github_user: "doumanash"
      quay_user: "doumanash"
      quay_bot_suffix: "nginx-sftp-ci"
      build_args: |
        ALPINE_VERSION=${{ matrix.alpine_version }}
      post_build_script: |
          NGINX_VERSION=$(podman run --rm --entrypoint nginx localhost/${{ github.event.repository.name }} -version 2>&1 | cut -d" " -f3 | cut -d"/" -f2)
          echo "- Nginx version: $NGINX_VERSION" >> $GITHUB_STEP_SUMMARY
          VERSION=$(podman run --rm --entrypoint sshd.pam localhost/${{ github.event.repository.name }} -V 2>&1 | cut -d"," -f1 | cut -d"_" -f2)
          echo "- Openssh version: $VERSION" >> $GITHUB_STEP_SUMMARY
          ALPINE_VERSION=$(podman run --rm --entrypoint cat localhost/${{ github.event.repository.name }} /etc/os-release | grep VERSION_ID | cut -d"=" -f2 | tr -d '"' | cut -d"." -f 1,2)
          echo "- Alpine version: $ALPINE_VERSION" >> $GITHUB_STEP_SUMMARY

          if [ "$ALPINE_VERSION" = "3.24" ]; then
              echo "tags=latest $ALPINE_VERSION" >> "$GITHUB_OUTPUT"
          else
              echo "tags=$ALPINE_VERSION" >> "$GITHUB_OUTPUT"
          fi
