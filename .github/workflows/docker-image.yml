name: Docker

on:
  # Once a week
  schedule:
    - cron: '0 0 * * 0'
  push:
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile.*'
      - 'root/**/*'
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - '.github/workflows/docker-image.yml'
      - 'Dockerfile.*'
      - 'root/**/*'

env:
  DOCKER_REGISTRY: docker.io
  GITHUB_REGISTRY: ghcr.io
  QUAY_REGISTRY: quay.io
  DOCKER_IMAGE_NAME: douman/nginx-sftp
  GITHUB_IMAGE_NAME: doumanash/nginx-sftp
  LATEST_ALPINE_VERSION: 3.24

jobs:
  build:
    permissions:
      contents: read
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        alpine_version: [3.23, 3.24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
          platforms: arm64

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log into ${{ env.DOCKER_REGISTRY }} registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: douman
          ## Set in repo Settings->Secrets->New repository secret
          password: ${{ secrets.DOCKER_TOKEN }}

      # Access to docker hardened images
      - name: Log into dhi.io registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: douman
          ## Set in repo Settings->Secrets->New repository secret
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log into ${{ env.GITHUB_REGISTRY }} registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into ${{ env.QUAY_REGISTRY }} registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: doumanash+nginx-sftp-ci
          ## Set in repo Settings->Secrets->New repository secret
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build Docker image
        id: build-docker
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          file: Dockerfile
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{env.DOCKER_REGISTRY}}/${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.alpine_version }}
            ${{env.GITHUB_REGISTRY}}/${{ env.GITHUB_IMAGE_NAME }}:${{ matrix.alpine_version }}
            ${{env.QUAY_REGISTRY}}/${{ env.GITHUB_IMAGE_NAME }}:${{ matrix.alpine_version }}

      - name: Generate summary
        id: test
        env:
          IMAGE_REF: ${{env.DOCKER_REGISTRY}}/${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.alpine_version }}
        run: |
          echo '## Build docker ${{ matrix.alpine_version }} image 🚀' >> $GITHUB_STEP_SUMMARY
          VERSION=$(docker run --rm --entrypoint nginx $IMAGE_REF -version 2>&1 | cut -d" " -f3 | cut -d"/" -f2)
          echo "- Nginx version: $VERSION" >> $GITHUB_STEP_SUMMARY
          VERSION=$(docker run --rm --entrypoint sshd.pam $IMAGE_REF -V 2>&1 | cut -d"," -f1 | cut -d"_" -f2)
          echo "- Openssh version: $VERSION" >> $GITHUB_STEP_SUMMARY
          VERSION=$(docker run --rm --entrypoint cat $IMAGE_REF /etc/os-release | grep VERSION_ID | cut -d"=" -f2 | tr -d '"' | cut -d"." -f 1,2)
          echo "- Alpine version: $VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Check vulnerabilities
        uses: DoumanAsh/douman-ci/.github/actions/trivy-report-vuln@v1.1.4
        with:
          image_ref: "${{env.DOCKER_REGISTRY}}/${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.alpine_version }}"
          image_name: "nginx-sftp:${{ matrix.alpine_version }}"
          pr_comment: ${{ github.event_name == 'pull_request' }}
          pr_comment_recreate: true

      - name: Push Docker image
        id: push-docker
        if: matrix.alpine_version != env.LATEST_ALPINE_VERSION
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          sbom: false
          provenance: false
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.alpine_version }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:${{ matrix.alpine_version }}
            ${{ env.QUAY_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:${{ matrix.alpine_version }}

      - name: Push latest Docker image
        id: push-latest-docker
        if: matrix.alpine_version == env.LATEST_ALPINE_VERSION
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          sbom: false
          provenance: false
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.alpine_version }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:latest
            ${{ env.GITHUB_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:${{ matrix.alpine_version }}
            ${{ env.QUAY_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:latest
            ${{ env.QUAY_REGISTRY }}/${{ env.GITHUB_IMAGE_NAME }}:${{ matrix.alpine_version }}
